[package]
name = "helium-shell"
version = "0.4.0"
edition = "2021"
description = "A Wayland shell built with the Helium shell framework"
authors = ["Daniel Azevedo", "dani-77 <daniazevedo77@posteo.net>"]
license = "MIT"

# One binary for every program; the packages add helium-<applet> symlinks
# (see src/main.rs).
[[bin]]
name = "helium"
path = "src/main.rs"

[dependencies]
helium-wsl = { git = "https://github.com/zepyxunderscore/helium-wsl.git" }
zbus = "4"
zvariant = "4"
tokio = { version = "1", features = ["rt"] }
# Direct dependency so primary_monitor_width() can query niri's Outputs IPC
# itself, working around a parsing bug in helium-wsl's niri backend — see
# the comment on niri_monitor_width() in src/apps/shell.rs.
serde_json = "1"

# Direct dependency (rather than just helium-wsl's `raw` re-export) for the
# binaries that need layer-shika APIs helium-wsl's `Helium`/`ShellInstance`
# wrapper doesn't expose (e.g. helium-osd's per-surface resize).
layer-shika = "0.3"
# Direct dependencies for src/ext_workspace.rs, already in the tree through
# layer-shika. `staging` brings ext-workspace-v1, `unstable` brings xdg-output.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# PAM authentication for helium-locker (src/lock/auth.rs).
pam-client2 = "0.5"
# helium-locker: drives ext-session-lock-v1 directly through
# smithay-client-toolkit (the same backend Amorphis uses) and renders
# ui/lock.slint with Slint's software renderer into wl_shm buffers, so the
# session lock no longer goes through layer-shika. Both are already in the
# tree via layer-shika/helium-wsl; libc is for the vendored src/lock/system.rs.
smithay-client-toolkit = "0.20"
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
libc = "0.2"
env_logger = "0.11"

# Smaller binaries: every helium-* binary carries its own copy of Slint,
# helium-wsl, layer-shika, tokio and zbus, so size dominates. Measured on
# 0.4.0: 204 MB -> 139 MB for the eight binaries, at the cost of a slower
# release build (about 5 minutes on 16 cores).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
